name: Daily MyTek Promo Scraper

on:
  schedule:
    # S'exécute automatiquement chaque matin à 6h00 UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Permet de lancer le scan manuellement quand vous voulez

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install httpx beautifulsoup4 lxml

      - name: Run Scraper
        run: |
          python scraper.py

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/promotions.json promotions.json
          git diff --staged --quiet || (git commit -m "🤖 Auto-update MyTek promotions data" && git push)
